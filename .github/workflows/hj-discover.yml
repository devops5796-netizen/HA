name: Haraj 0 - Discover Categories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  discover-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover categories
        run: python discover_categories.py

      - name: Upload categories CSV
        uses: actions/upload-artifact@v4
        with:
          name: haraj-categories
          path: haraj_all_categories.csv
          if-no-files-found: error
          retention-days: 3

# This workflow does nothing else. "Haraj 1 - Cars" watches for its
# completion (on: workflow_run) and starts automatically once this succeeds.