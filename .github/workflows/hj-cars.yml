name: Haraj 1 - Cars

on:
  workflow_run:
    workflows: ["Haraj 0 - Discover Categories"]
    types: [completed]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Grab the CSV produced by "Haraj 0 - Discover Categories" and re-publish it
  # as an artifact of THIS run, so every job below (and the next workflow in
  # the chain, "Haraj 2 - Batch 2") can fetch it without extra run-id wiring.
  # ===========================================================================
  prepare-categories:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download categories CSV from the discover run
        uses: actions/download-artifact@v4
        with:
          name: haraj-categories
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Re-publish categories CSV for this workflow's jobs
        uses: actions/upload-artifact@v4
        with:
          name: haraj-categories
          path: haraj_all_categories.csv
          if-no-files-found: error
          retention-days: 3

  # ===========================================================================
  # Cars alone has ~90+ brands (level_1) and thousands of scrape tasks -- too
  # much for a single 6h job (this is what was getting cancelled before).
  # Split it into 6 shards by level_1 (brand), running in parallel.
  # ===========================================================================
  scrape-cars:
    runs-on: ubuntu-latest
    needs: prepare-categories
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download categories CSV
        uses: actions/download-artifact@v4
        with:
          name: haraj-categories

      - name: Scrape Cars - shard ${{ matrix.shard }}/6
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python haraj_pipeline.py \
            --categories haraj_all_categories.csv \
            --cat-name "Cars" \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6 \
            --skip-summary \
            --upload-target r2

      - name: Upload summary placeholder
        uses: actions/upload-artifact@v4
        with:
          name: summary-Cars-shard${{ matrix.shard }}
          path: |
            summary_placeholder_*.json
          if-no-files-found: ignore

  # ===========================================================================
  # Merge the 6 shard summaries into one Cars summary.json and upload it.
  # ===========================================================================
  finalize-cars:
    runs-on: ubuntu-latest
    needs: scrape-cars
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get workflow duration
        id: workflow_duration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          NOW_TIMESTAMP=$(date -u +%s)
          DURATION_SEC=$((NOW_TIMESTAMP - START_TIMESTAMP))
          echo "duration_sec=$DURATION_SEC" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT"
          echo "Workflow duration: ${DURATION_SEC}s"

      - name: Download all Cars shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: summary-Cars-shard*
          merge-multiple: true
          path: summaries/

      - name: Merge shards and upload Cars summary to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_DURATION: ${{ steps.workflow_duration.outputs.duration_sec }}
        run: |
          python finalize_summaries.py --summaries-dir summaries/ --date "$(date -u +%Y-%m-%d)" --workflow haraj

# "Haraj 2 - Batch 2" watches for THIS workflow's completion (on: workflow_run)
# and starts automatically once every job above succeeds.