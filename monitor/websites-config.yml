# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch Haraj (daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "Haraj 0 - Discover Categories"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Haraj 1 - Cars"
  - batch: "Haraj 1 - Cars"
    trigger: "on_completion: Haraj 0 - Discover Categories"
    triggers_next: "Haraj 2 - Batch 2"
  - batch: "Haraj 2 - Batch 2"
    trigger: "on_completion: Haraj 1 - Cars"
    triggers_next: "Haraj 3 - Batch 3"
  - batch: "Haraj 3 - Batch 3"
    trigger: "workflow_dispatch (triggered by Haraj 2 - Batch 2)"
    triggers_next: null

# ============================================================
# EXCEL SCHEMA — Per-scraper .xlsx output validation
# One entry per scraper; each describes the sheets, required
# column headers, expected row range, and min file size.
# ============================================================

# ── REUSABLE COLUMN ANCHORS ─────────────────────────────────

_col_standard_listing: &col_standard_listing
  - id

# ── PER-SCRAPER SCHEMAS ──────────────────────────────────────
excel_schema:

  # ── BATCH Haraj ─────────────────────────────────────────────────

